<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VibeBoard Logo</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .icon-grid {
      width: 100px;
      height: 100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05); /* Transparent feel */
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 12px rgba(116, 188, 217, 0.2);
      padding: 10px;
    }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }

    .icon svg {
      width: 24px;
      height: 24px;
      fill: #666;
    }

    .vibeboard-text {
      font-size: 48px;
      font-weight: 700;
    }

    .vibeboard-text .vibe {
      color: #f2a7c0;
    }

    .vibeboard-text .board {
      color: #74bcd9;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <div class="icon-grid">
      <div class="icon">
        <!-- Check (Task) -->
        <svg viewBox="0 0 24 24">
          <path d="M9 16.2l-3.5-3.5L4 14.2l5 5 12-12-1.5-1.5z"/>
        </svg>
      </div>
      <div class="icon">
        <!-- Graph (Grades) -->
        <svg viewBox="0 0 24 24">
          <path d="M3 17h2v-7H3v7zm4 0h2v-4H7v4zm4 0h2v-10h-2v10zm4 0h2v-6h-2v6zm4 0h2v-2h-2v2z"/>
        </svg>
      </div>
      <div class="icon">
        <!-- Heart (Habits) -->
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 
          4.42 3 7.5 3c1.74 0 3.41 0.81 4.5 2.09C13.09 
          3.81 14.76 3 16.5 3 19.58 3 22 5.42 
          22 8.5c0 3.78-3.4 6.86-8.55 
          11.54L12 21.35z"/>
        </svg>
      </div>
      <div class="icon">
        <!-- Coin (Finance) -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 
          12s4.48 10 10 10 10-4.48 
          10-10S17.52 2 12 2zm0 
          18c-4.41 0-8-3.59-8-8s3.59-8 
          8-8 8 3.59 8 8-3.59 8-8 
          8zm-1-13h2v2h-2zm0 
          4h2v6h-2z"/>
        </svg>
      </div>
    </div>
    <div class="vibeboard-text">
      <span class="vibe">Vibe</span><span class="board">Board</span>
    </div>
  </div>

</body>
</html>
